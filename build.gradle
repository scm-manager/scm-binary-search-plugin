plugins {
  id 'org.scm-manager.smp' version '0.21.1'
}

dependencies {
  plugin "sonia.scm.plugins:scm-content-search-plugin:4.0.0-SNAPSHOT"

  implementation('org.apache.tika:tika-core:3.2.3') {
    exclude group: "xml-apis", module: "xml-apis"
    exclude group: "xerces", module: "xercesImpl"
  }
  implementation('org.apache.tika:tika-parsers-standard-package:3.2.3') {
    exclude group: "xml-apis", module: "xml-apis"
    exclude group: "xerces", module: "xercesImpl"
  }
}

scmPlugin {
  scmVersion = "4.0.0-SNAPSHOT"
  displayName = "Binary Search"
  description = "Enriches the search index with binary file content"

  author = "Cloudogu GmbH"
  category = "Information"
  childFirstClassloader = true

  openapi {
    packages = [
      "com.cloudogu.binarysearch"
    ]
  }
}
